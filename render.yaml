services:
  - type: web
    name: whale-hunter-ai-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGIN
        value: "*"
      - key: ALCHEMY_API_KEY
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
      - key: CMC_API_KEY
        sync: false
      - key: CMC_API_BASE_URL
        value: "https://pro-api.coinmarketcap.com"
      - key: MIN_WHALE_USD
        value: "100000"
      - key: BITQUERY_API_KEY
        sync: false
      - key: NANSEN_API_KEY
        sync: false
      - key: ARKHAM_API_KEY
        sync: false
      - key: BITQUERY_GRAPHQL_URL
        value: "https://graphql.bitquery.io"
      - key: BITQUERY_LABELS_GRAPHQL_URL
        value: "https://streaming.bitquery.io/graphql"
