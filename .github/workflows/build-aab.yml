name: Build Whale Hunter AI AAB
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build Android App Bundle
        run: gradle -p android_work bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: WhaleHunterAI-release-aab
          path: android_work/app/build/outputs/bundle/release/app-release.aab
