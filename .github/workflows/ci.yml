name: WhaleHunterAI CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package.json
      - run: npm install --omit=dev
      - run: node --check src/index.js
      - run: node --check src/scanToken.js
      - run: node --check src/holderProvider.js
      - run: node --check src/addressClassifier.js
      - run: node --check src/masterSignal.js
      - run: node --check src/confidenceEngine.js
      - run: node --check src/technicalProvider.js
      - run: node --check src/tokenAnalysisEngine.js
