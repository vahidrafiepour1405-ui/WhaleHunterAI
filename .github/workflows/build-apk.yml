name: Build Whale Hunter AI APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK
        run: echo "$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle -p android_work assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WhaleHunterAI-debug-apk
          path: android_work/app/build/outputs/apk/debug/app-debug.apk