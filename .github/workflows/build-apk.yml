name: Build Whale Hunter AI APK
on:
 workflow_dispatch:
 push:
  branches: [ main ]
permissions:
 contents: write
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '17'
   - name: Check Android SDK
     run: echo "$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -1
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: '8.13'
   - name: Build signed release APK
     run: gradle -p android_work assembleRelease
   - uses: actions/upload-artifact@v4
     with:
      name: WhaleHunterAI-release-apk
      path: android_work/app/build/outputs/apk/release/app-release.apk
   - name: Publish GitHub Release
     env:
      GH_TOKEN: ${{ github.token }}
     run: |
      gh release create v14.0.0 android_work/app/build/outputs/apk/release/app-release.apk --title "Whale Hunter AI PRO 14.0.0" --notes "Direct-install APK build. Generated by GitHub Actions." --latest
