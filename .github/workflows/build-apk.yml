name: Build Whale Hunter AI APK
on:
 workflow_dispatch:
permissions:
 contents: write
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '17'
   - name: Check Android SDK
     run: echo "$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -1
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: '8.13'
   - name: Build release APK
     run: |
      set -o pipefail
      gradle -p android_work assembleRelease --stacktrace 2>&1 | tee /tmp/gradle-build.log
   - name: Save build diagnostics
     if: failure()
     env:
      GH_TOKEN: ${{ github.token }}
     run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git fetch origin main
      git checkout -B build-debug origin/main
      mkdir -p build-debug
      cp /tmp/gradle-build.log build-debug/gradle-build.log
      git add build-debug/gradle-build.log
      git commit -m "debug: capture Android build log" || true
      git push origin build-debug --force
   - uses: actions/upload-artifact@v4
     with:
      name: WhaleHunterAI-release-apk-v22
      path: android_work/app/build/outputs/apk/release/app-release.apk
   - name: Publish GitHub Release
     env:
      GH_TOKEN: ${{ github.token }}
     run: |
      gh release view v22.0.0 >/dev/null 2>&1 || gh release create v22.0.0 --title "Whale Hunter AI PRO 21.0.0" --notes "Live online build with automatic network reconnect, multi-source market data, whale evidence and Top-500 priority surveillance."
      gh release upload v22.0.0 android_work/app/build/outputs/apk/release/app-release.apk --clobber
      gh release edit v22.0.0 --title "Whale Hunter AI PRO 21.0.0" --latest