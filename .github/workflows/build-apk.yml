name: Build Whale Hunter AI APK
on:
 workflow_dispatch:
permissions:
 contents: write
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '17'
   - name: Check Android SDK
     run: echo "$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -1
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: '8.13'
   - name: Prepare stable signing key
     env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
     run: |
      set -e
      echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/whalehunterai-release.keystore"
      test -s "$RUNNER_TEMP/whalehunterai-release.keystore"
      keytool -list -keystore "$RUNNER_TEMP/whalehunterai-release.keystore" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null
      echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/whalehunterai-release.keystore" >> "$GITHUB_ENV"
      echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
      echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
      echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
   - name: Build release APK
     run: |
      set -o pipefail
      gradle -p android_work assembleRelease --stacktrace 2>&1 | tee /tmp/gradle-build.log
   - name: Save build diagnostics
     if: failure()
     env:
      GH_TOKEN: ${{ github.token }}
     run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git fetch origin main
      git checkout -B build-debug origin/main
      mkdir -p build-debug
      cp /tmp/gradle-build.log build-debug/gradle-build.log
      git add build-debug/gradle-build.log
      git commit -m "debug: capture Android build log" || true
      git push origin build-debug --force
   - uses: actions/upload-artifact@v4
     with:
      name: WhaleHunterAI-release-apk-v23
      path: android_work/app/build/outputs/apk/release/app-release.apk
   - name: Publish GitHub Release
     env:
      GH_TOKEN: ${{ github.token }}
     run: |
      gh release view v23.0.0 >/dev/null 2>&1 || gh release create v23.0.0 --title "Whale Hunter AI PRO 23.0.0" --notes "Live online build with automatic network reconnect, multi-source market data, whale evidence and Top-500 priority surveillance."
      gh release upload v23.0.0 android_work/app/build/outputs/apk/release/app-release.apk --clobber
      gh release edit v23.0.0 --title "Whale Hunter AI PRO 23.0.0" --latest