name: Build Whale Hunter AI APK
on:
 workflow_dispatch:
permissions:
 contents: write
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '17'
   - name: Check Android SDK
     run: echo "$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -1
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: '8.13'
   - name: Prepare stable signing key
     env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
     run: |
      set -e
      test -n "$SIGNING_KEYSTORE_BASE64"
      echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/whalehunterai-release.keystore"
      test -s "$RUNNER_TEMP/whalehunterai-release.keystore"
      keytool -list -keystore "$RUNNER_TEMP/whalehunterai-release.keystore" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null
      echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/whalehunterai-release.keystore" >> "$GITHUB_ENV"
      echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
      echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
      echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
   - name: Build release APK
     run: gradle -p android_work assembleRelease --stacktrace
   - uses: actions/upload-artifact@v4
     with:
      name: WhaleHunterAI-release-apk-v24
      path: android_work/app/build/outputs/apk/release/app-release.apk
   - name: Publish GitHub Release
     env:
      GH_TOKEN: ${{ github.token }}
     run: |
      gh release view v24.0.0 >/dev/null 2>&1 || gh release create v24.0.0 --title "Whale Hunter AI 24.0.0" --notes "Online multi-source whale and market analysis Android build."
      gh release upload v24.0.0 android_work/app/build/outputs/apk/release/app-release.apk --clobber
      gh release edit v24.0.0 --title "Whale Hunter AI 24.0.0" --latest
