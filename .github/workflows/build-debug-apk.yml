name: Build installable Whale Hunter AI APK
on:
 push:
  branches: [ main ]
 workflow_dispatch:
permissions:
 contents: read
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '17'
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: '8.13'
   - name: Build installable debug APK
     run: gradle -p android_work assembleDebug --stacktrace
   - name: Upload installable APK
     uses: actions/upload-artifact@v4
     with:
      name: WhaleHunterAI-installable-debug-apk
      path: android_work/app/build/outputs/apk/debug/app-debug.apk
